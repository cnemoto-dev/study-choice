/* ===== Utility ===== */
function getTimeAgo(ts) {
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 5) return 'たった今';
  if (d < 60) return d + '秒前';
  if (d < 3600) return Math.floor(d / 60) + '分前';
  return Math.floor(d / 3600) + '時間前';
}

/* ===== Components ===== */
function StarRating({ rating }) {
  const filled = Math.round(rating);
  return (
    <span className="inline-flex items-center gap-px">
      {[1,2,3,4,5].map(i => (
        <span key={i} className={i <= filled ? 'text-yellow-400' : 'text-gray-300'} style={{fontSize:'11px'}}>&#9733;</span>
      ))}
      <span className="text-xs text-gray-400 ml-1">{rating.toFixed(1)}</span>
    </span>
  );
}

function RankBadge({ rank }) {
  const cls = rank === 1 ? 'bg-yellow-400 text-yellow-900'
    : rank === 2 ? 'bg-gray-300 text-gray-700'
    : rank === 3 ? 'bg-amber-600 text-white'
    : 'bg-gray-100 text-gray-500';
  return (
    <span className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${cls}`}>
      {rank}
    </span>
  );
}

function RankingCard({ item, rank, onVote, voted, secKey }) {
  const linkUrl = secKey === 'stores'
    ? 'https://www.google.com/maps/search/' + encodeURIComponent(item.name)
    : 'https://www.amazon.co.jp/s?k=' + encodeURIComponent(item.name);
  const [anim, setAnim] = useState(false);
  const handleClick = () => {
    if (voted) return;
    setAnim(true);
    onVote();
    setTimeout(() => setAnim(false), 750);
  };
  return (
    <div className={`rank-card relative flex items-center gap-3 p-3 rounded-lg border border-gray-100 ${anim ? 'vote-pulse' : ''}`}>
      <RankBadge rank={rank} />
      <div className="flex-1 min-w-0">
        <a href={linkUrl} target="_blank" rel="noopener noreferrer"
          className="text-sm font-medium text-blue-700 hover:text-blue-900 hover:underline truncate block">{item.name}</a>
        <div className="flex items-center gap-2 mt-0.5">
          <StarRating rating={item.rating} />
          <span className="text-xs font-semibold text-gray-500">{item.votes}票</span>
        </div>
      </div>
      <button onClick={handleClick} disabled={voted}
        className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
          voted ? 'bg-gray-100 text-gray-400 cursor-default' : 'bg-blue-600 text-white hover:bg-blue-700 active:scale-95'
        }`}>
        {voted ? '投票済' : '投票'}
      </button>
      {anim && <span className="float-up absolute right-14 -top-1 text-blue-600 font-bold text-sm pointer-events-none">+1</span>}
    </div>
  );
}

function RankingSection({ title, items, colorKey, onVote, votedSet, catId, secKey }) {
  const border = { blue:'border-blue-500', emerald:'border-emerald-500', violet:'border-violet-500' }[colorKey];
  const bg    = { blue:'bg-blue-50', emerald:'bg-emerald-50', violet:'bg-violet-50' }[colorKey];
  const text  = { blue:'text-blue-700', emerald:'text-emerald-700', violet:'text-violet-700' }[colorKey];
  const sorted = [...items].sort((a, b) => b.votes - a.votes);
  return (
    <div className={`bg-white rounded-xl shadow-md overflow-hidden border-t-4 ${border}`}>
      <div className={`${bg} px-5 py-3`}>
        <h3 className={`font-bold text-sm ${text}`}>{title}</h3>
      </div>
      <div className="p-4 space-y-2">
        {sorted.map((item, idx) => (
          <RankingCard key={item.id} item={item} rank={idx + 1}
            onVote={() => onVote(catId, secKey, item.id)}
            voted={votedSet.has(catId + '-' + secKey + '-' + item.id)}
            secKey={secKey} />
        ))}
      </div>
    </div>
  );
}

                <span className={`text-xs font-medium ${a.isUser ? 'text-blue-700' : 'text-gray-600'}`}>{a.user[0]}</span>

              <div className="min-w-0">
                <p className="text-xs text-gray-600">
                  <span className="font-medium text-gray-800">{a.user}</span> が投票
                </p>
                <p className="text-xs text-gray-500 truncate">{a.item}</p>
                <p className="text-xs text-gray-400 mt-0.5">{a.category} / {getTimeAgo(a.timestamp)}</p>
              </div>
            </div>
          </div>
        ))}
      </div>

}

function App() {
  const [activeCat, setActiveCat] = useState('bookkeeping');
  const [data, setData] = useState(() => JSON.parse(JSON.stringify(INITIAL_DATA)));
  const [votedSet, setVotedSet] = useState(new Set());
  const [activities, setActivities] = useState([]);
  const [totalVotes, setTotalVotes] = useState(0);
  const [, setTick] = useState(0);
  const aidRef = useRef(0);

  // Force re-render every 10s to update time-ago labels
  useEffect(() => {
    const t = setInterval(() => setTick(n => n + 1), 10000);
    return () => clearInterval(t);
  }, []);

  // Fake activity generator
  useEffect(() => {
    const gen = () => {
      const cat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
      const sk = ['textbooks','stores','goods'][Math.floor(Math.random() * 3)];
      const items = INITIAL_DATA[cat.id][sk];
      const item = items[Math.floor(Math.random() * items.length)];
      const user = FAKE_USERS[Math.floor(Math.random() * FAKE_USERS.length)];
      aidRef.current += 1;
      setActivities(prev => [{ id: 'f' + aidRef.current, user, item: item.name, category: cat.name, timestamp: Date.now(), isUser: false }, ...prev].slice(0, 25));
    };
    // seed initial entries
    const inits = [];
    for (let i = 0; i < 6; i++) {
      const cat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
      const sk = ['textbooks','stores','goods'][Math.floor(Math.random() * 3)];
      const items = INITIAL_DATA[cat.id][sk];
      const item = items[Math.floor(Math.random() * items.length)];
      const user = FAKE_USERS[Math.floor(Math.random() * FAKE_USERS.length)];
      aidRef.current += 1;
      inits.push({ id: 'f' + aidRef.current, user, item: item.name, category: cat.name, timestamp: Date.now() - (6 - i) * 18000, isUser: false });
    }
    setActivities(inits);
    const iv = setInterval(gen, 4000);
    return () => clearInterval(iv);
  }, []);

  const handleVote = useCallback((catId, secKey, itemId) => {
    const vk = catId + '-' + secKey + '-' + itemId;
    setVotedSet(prev => { const s = new Set(prev); s.add(vk); return s; });
    setTotalVotes(prev => prev + 1);
    setData(prev => {
      const nd = JSON.parse(JSON.stringify(prev));
      const it = nd[catId][secKey].find(x => x.id === itemId);
      if (it) it.votes += 1;
      return nd;
    });
    // find item name for activity
    const it = data[catId][secKey].find(x => x.id === itemId);
    const cn = CATEGORIES.find(c => c.id === catId).name;
    aidRef.current += 1;
    setActivities(prev => [{ id: 'u' + aidRef.current, user: 'あなた', item: it ? it.name : '', category: cn, timestamp: Date.now(), isUser: true }, ...prev].slice(0, 25));
  }, [data]);

  const cur = data[activeCat];

  return (
    <div className="min-h-screen bg-gray-50">
      <Header totalVotes={totalVotes} />
      <div className="pt-14">
        <CategoryTabs active={activeCat} onSelect={setActiveCat} />
        <div className="flex">
          <main className="flex-1 mr-0 lg:mr-72 p-6">
            <div key={activeCat} className="content-fade grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {SECTIONS.map(sec => (
                <RankingSection key={sec.key} title={sec.label} items={cur[sec.key]}
                  colorKey={sec.color} onVote={handleVote} votedSet={votedSet}
                  catId={activeCat} secKey={sec.key} />
              ))}
            </div>
          </main>
          <aside className="hidden lg:block fixed right-0 top-14 w-72 h-[calc(100vh-3.5rem)] bg-white border-l border-gray-200">
            <ActivityFeed activities={activities} />
          </aside>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
